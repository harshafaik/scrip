[package]
name = "scrip"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Seeded, reproducible synthetic financial transaction data — customers, accounts, cards, transactions, and injected fraud with ground-truth labels."
license = "MIT"
readme = "README.md"
keywords = ["synthetic-data", "test-data", "finance", "fraud", "simulation"]
categories = ["development-tools::testing", "simulation"]

[[bin]]
name = "scrip"
path = "src/main.rs"

[[bin]]
name = "scrip-world"
path = "src/bin/scrip_world.rs"
required-features = ["worldbuild"]

[dependencies]
rand = "0.9"
rayon = "1.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
h3o = "0.9"
clap = { version = "4", features = ["derive"] }
polars = { version = "0.51.0", features = [
  "lazy",
  "parquet",
  "dtype-datetime",
  "temporal",
  "strings",
  "serde",
] }
osmpbf = { version = "0.3.4", optional = true }
geo = { version = "0.29.3", optional = true }
geojson = { version = "1.0.0", features = ["geo-types"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1

[features]
default = []
worldbuild = ["dep:osmpbf", "dep:geo", "dep:geojson"]
